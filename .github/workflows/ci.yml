name: CI - Build & Test Docker

on:
  push:
    branches: [ main, develop ]

jobs:
  test-docker:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build backend jar
      run: |
        cd healthcare-connect-backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        DB_HOST=postgres
        DB_PORT=5432
        DB_NAME=healthcare_db
        DB_USERNAME=postgres
        DB_PASSWORD=test123
        RABBITMQ_HOST=rabbitmq
        RABBITMQ_PORT=5672
        RABBIT_USERNAME=guest
        RABBIT_PASSWORD=guest
        MINIO_ENDPOINT=http://minio:9000
        MINIO_ACCESS_KEY=minioadmin
        MINIO_SECRET_KEY=minioadmin
        MINIO_BUCKET_NAME=doctor-cvs
        JWT_SIGNER_KEY=test123456789012345678901234567890
        CLOUD_NAME=test
        CLOUD_API_KEY=test
        CLOUD_API_SECRET=test
        PARTNER_CODE=MOMO
        ACCESS_KEY=test
        SECRET_KEY=test
        FRONTEND_URL=http://localhost
        CORS_ALLOWED_ORIGINS=http://localhost
        MAIL_USERNAME=
        MAIL_PASSWORD=
        NOTIFY_URL=http://localhost
        EOF
    
    - name: Build Docker images
      run: docker compose build
    
    - name: Start services
      run: docker compose up -d
    
    - name: Wait for services
      run: |
        sleep 30
        docker compose ps
    
    - name: Check backend health
      run: |
        curl -f http://localhost:8080/actuator/health || docker compose logs backend
    
    - name: Show logs if failed
      if: failure()
      run: docker compose logs
      
  push-to-docker:
    runs-on: ubuntu-latest
    needs: test-docker
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build backend jar
      run: |
        cd healthcare-connect-backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Backend image
      run: |
        cd healthcare-connect-backend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:latest ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/healthcare-backend:${{ github.run_number }}
    
    - name: Build and push Frontend image
      run: |
        cd healthcare-connect-frontend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:latest ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:${{ github.run_number }}