name: CI - Build & Test Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-docker:
    runs-on: ubuntu-latest  # Đã đúng là Ubuntu rồi
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Nâng lên v4
    
    - name: Create .env file from example
      run: |
        cp .env.example .env
        # Dùng sed với định dạng khác (thêm g để global)
        sed -i 's/CHANGE_ME_STRONG_PASSWORD/test123/g' .env
        sed -i 's/CHANGE_ME_JWT_SECRET_KEY_32_CHARS_PLUS/test123/g' .env
        sed -i 's/your_cloud_name/test123/g' .env
        sed -i 's/your_api_key/test123/g' .env
        sed -i 's/your_api_secret/test123/g' .env
        
        # Debug: in ra nội dung .env để xem
        cat .env
    
    - name: Build Docker images
      run: |
        docker-compose build
    
    - name: Start all services
      run: |
        docker-compose up -d
    
    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to start..."
        sleep 30
        docker-compose ps
    
    - name: Check backend health
      run: |
        curl -f http://localhost:8080/actuator/health || docker-compose logs backend
    
    - name: Show logs if failed
      if: failure()
      run: docker-compose logs