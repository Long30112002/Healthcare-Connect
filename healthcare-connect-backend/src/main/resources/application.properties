spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.application.name=healthcare-connect
spring.datasource.driver-class-name=org.postgresql.Driver
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=false

# JPA & Flyway
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT
jwt.signerKey=${JWT_SIGNER_KEY}

## Mail (mailtrap)
#spring.mail.host=sandbox.smtp.mailtrap.io
#spring.mail.port=2525
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# Gmail
spring.mail.host=smtp.gmail.com
#spring.mail.port=587
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true
spring.mail.test-connection=false
logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

#Cloud
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${CLOUD_API_KEY}
cloudinary.api-secret=${CLOUD_API_SECRET}

# application-prod.properties
minio.endpoint=${MINIO_ENDPOINT}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET_NAME}


#RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}

# ================= RETRY =================
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.multiple=true
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.retry.republish-to-dlx=true
#spring.rabbitmq.ssl.enabled=true
#spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Allowed image types
app.upload.allowed-image-types=image/jpeg,image/png,image/gif,image/webp

# ================= ACK =================
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# ================= MOMO =================
momo.partner-code=${PARTNER_CODE}
momo.access-key=${ACCESS_KEY}
momo.secret-key=${SECRET_KEY}
momo.endpoint=${ENDPOINT}
momo.return-url=${RETURN_URL}
momo.notify-url=${NOTIFY_URL}
payment.momo.enabled=true

# ================= FRONTEND & CORS =================
app.frontend.url=${FRONTEND_URL}
app.frontend.url.host=${FRONTEND_URL_HOST:${FRONTEND_URL}}
app.frontend.public-url=${PUBLIC_FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
