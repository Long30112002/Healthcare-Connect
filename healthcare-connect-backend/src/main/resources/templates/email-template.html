<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Connect Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .header {
            background: linear-gradient(135deg, #007bff, #00a1ff);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 8px;
        }
        .body {
            padding: 40px 32px;
            background: #ffffff;
        }
        .greeting {
            font-size: 24px;
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 16px;
        }
        .message {
            font-size: 16px;
            color: #334e68;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 40px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            margin: 8px 0 12px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #1e7e34, #146b2e);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .footer {
            background-color: #f8fafc;
            padding: 24px 32px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #5a6e8a;
        }
        .footer p {
            margin: 6px 0;
        }
        .footer a {
            color: #007bff;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .body {
                padding: 28px 20px;
            }
            .greeting {
                font-size: 22px;
            }
            .btn {
                padding: 10px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <h1>Healthcare Connect</h1>
        <p>Your trusted health partner</p>
    </div>
    <div class="body">
        <div class="greeting" th:text="'Chào ' + ${name} + '!'"></div>
        <div class="message" th:text="${message}"></div>
        <div th:if="${url}">
            <a th:href="${url}" class="btn" th:text="${btnText != null ? btnText : 'Xác thực tài khoản'}"></a>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2026 Healthcare Connect System. All rights reserved.</p>
        <p>If you did not request this, please ignore this email.</p>
        <p>Need help? <a href="#">Contact support</a></p>
    </div>
</div>
</body>
</html>
